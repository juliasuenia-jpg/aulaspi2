<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<!-- Materialize CSS -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

<!-- Material Icons -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons"
	rel="stylesheet">

<title>Eventos</title>

</head>

<body>

	<div th:replace="~{menu :: menu}"></div>

	<div class="container">

		<h1>Detalhes do evento</h1>


		<!-- Detalhes do Evento -->
		<div class="row">

			<div class="col s12">

				<div class="card">

					<div class="card-content">

						<span class="card-title">Evento</span>

						<p>
							<strong>Id: </strong> <span th:text="${evento.id}">1</span>
						</p>

						<p>
							<strong>Nome: </strong> <span th:text="${evento.nome}">
								Aniversário do José </span>
						</p>

						<p>
							<strong>Local: </strong> <span th:text="${evento.local}">
								Clube </span>
						</p>

						<p>
							<strong>Data: </strong> <span th:text="${evento.data}">
								25/02/2021 </span>
						</p>

						<p>
							<strong>Horário: </strong> <span th:text="${evento.horario}">
								20:00 </span>
						</p>

					</div>

				</div>

			</div>

		</div>


		<!-- Formulário Adicionar Convidado -->
		<div class="row">

			<div class="col s12">

				<div class="card">

					<div class="card-content">

						<span class="card-title"> Adicionar Convidado </span>

						<form th:action="@{/eventos/{id}(id=${evento.id})}" method="post">

							<div>
								<label>Nome: </label> <input type="text" name="nome">
							</div>

							<div>
								<label>RG: </label> <input type="text" name="rg">
							</div>

							<div>

								<button type="submit" class="btn">Salvar</button>

								<button type="reset" class="btn">Limpar</button>

							</div>

						</form>

					</div>

				</div>

			</div>

		</div>


		<!-- Tabela de Convidados -->
		<div class="row">

			<div class="col s12">

				<div class="card">

					<div class="card-content">

						<span class="card-title"> Convidados </span>

						<table class="highlight">

							<thead>

								<tr>
									<th>Id</th>
									<th>Nome</th>
									<th>RG</th>
									<th>Ações</th>
								</tr>

							</thead>

							<tbody>

								<tr th:each="c : ${convidados}">
									<td th:text="${c.id}">Id</td>
									<td th:text="${c.nome}">Nome</td>

									<td th:text="${c.rg}">RG</td>

									<td><a
										th:href="@{/eventos/{idEvento}/convidado/{idConvidado}/remover(
                                            idEvento=${evento.id},
                                            idConvidado=${c.id})}">
											<i class="material-icons"> delete </i>
									</a></td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
